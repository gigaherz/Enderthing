plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

neoForge.version = "26.1.2.124"
version = '1.10.3'
group = 'dev.gigaherz.enderthing'
base.archivesName = "Enderthing-${neoForge.minecraftVersion}"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main.resources.srcDirs += 'src/main/generated_resources'
}

neoForge {
    runs {
        // applies to all the run configs below
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
            //jvmArgument "-Dmixin.debug.export=true"
            //jvmArgument "-Dmixin.debug.verbose=true"
        }

        client {
            client()
        }

        server {
            server()
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', 'enderthing', '--all', '--output', file('src/main/generated_resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        thismod {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        // RS
        name = "CreeperHost Maven"
        url = "https://maven.creeperhost.net/"
    }
}

dependencies {
    compileOnly "mezz.jei:jei-26.1.2-common-api:29.16.0.47"
    runtimeOnly "mezz.jei:jei-26.1.2-common:29.16.0.47"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:29.16.0.47"
    runtimeOnly "mezz.jei:jei-26.1.2-neoforge:29.16.0.47"
    runtimeOnly("com.refinedmods.refinedstorage:refinedstorage-neoforge:3.2.1")
}

jar {
    from(files('LICENSE.txt'))

    manifest {
        attributes([
            "Specification-Title": "enderthing",
            "Specification-Vendor": "gigaherz",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor" :"gigaherz",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
